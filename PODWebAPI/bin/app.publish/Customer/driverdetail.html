        function getUrlVars() {
            var vars = [], hash;
            var hashes = window.location.href.slice(window.location.href.indexOf('?') + 1).split('&');
            for (var i = 0; i < hashes.length; i++) {
                hash = hashes[i].split('=');
                vars.push(hash[0]);
                vars[hash[0]] = hash[1];
            }
            return vars;
        }

        function loadMap(lat, lng) {
            geocoder = new google.maps.Geocoder();
            var latLng = new google.maps.LatLng(lat, lng);
            map = new google.maps.Map(document.getElementById('map'), {

            });

                url: rootPath + '/Content/img/map-start.svg',
                scaledSize: new google.maps.Size(30, 30), // scaled size

            directionDisplay_branch_to_driver = new google.maps.DirectionsRenderer({ suppressMarkers: true, polylineOptions: { strokeColor: "#00aa00" }, preserveViewport: true });

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        loadMap(position.coords.latitude, position.coords.longitude);
                    },
                    () => {
                        loadMap('20.5937', '78.9629');
                    }
                );
            } else {
                loadMap('20.5937', '78.9629');
                // Browser doesn't support Geolocation
            }
        }

        function initMap() {
            getCurrentLocation();
